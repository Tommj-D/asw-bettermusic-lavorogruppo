# Standalone development stack for the original Java-on-host scripts.
# Never merge this file into docker-compose.yml.
name: bettermusic-local
services:
  consul:
    image: hashicorp/consul:1.22.0
    user: "100:1000"
    entrypoint: [consul]
    command: [agent, -config-file=/consul/config/bettermusic.json]
    ports: ["127.0.0.1:8500:8500"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    sysctls: {net.ipv4.ip_forward: "0"}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /consul/data:rw,noexec,nosuid,nodev,size=128m,uid=100,gid=1000,mode=0700
    volumes:
      - ./docker/consul/consul.json:/consul/config/bettermusic.json:ro
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 256
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8500/v1/status/leader | grep -q ':8300'"]
      interval: 5s
      timeout: 4s
      retries: 12
    networks: [local-discovery]
networks:
  local-discovery: {driver: bridge, internal: false}
